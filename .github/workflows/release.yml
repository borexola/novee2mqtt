name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/novee2mqtt

jobs:
  app-image:
    name: Application image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The Supervisor installs the add-on at the version written in
      # addon/config.yaml and pulls the image tagged with it. A release whose
      # tag disagrees with that file would publish images nobody can install,
      # so refuse it here rather than find out from a user.
      - name: Check the add-on version matches
        run: |
          configured=$(sed -nE 's/^version: *"?([^"]*)"?$/\1/p' addon/config.yaml)
          if [ "$configured" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::addon/config.yaml declares version '$configured' but this release is '${{ steps.version.outputs.version }}'. Bump addon/config.yaml before tagging."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  addon-image:
    name: Add-on image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: app-image
    strategy:
      fail-fast: false
      matrix:
        # The Home Assistant builder dropped 32-bit ARM: it accepts only amd64
        # and aarch64. The standalone image below still ships linux/arm/v7.
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # builder.sh has no --build-arg option, so the application image is pinned
      # into the add-on Dockerfile's ARG default before the builder runs.
      - name: Pin the application image
        run: |
          sed -i "s|^ARG APP_IMAGE=.*|ARG APP_IMAGE=${{ env.IMAGE }}:${{ needs.app-image.outputs.version }}|" addon/Dockerfile
          grep '^ARG APP_IMAGE=' addon/Dockerfile

      # The Home Assistant builder wraps the application image, which is why it
      # runs only after app-image has pushed.
      - name: Build add-on
        uses: home-assistant/builder@2026.09.0
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/addon \
            --image novee2mqtt-{arch} \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon \
            --version ${{ needs.app-image.outputs.version }}
