name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0. To test the workflow instead, append a suffix to the configured version, e.g. 1.0.0-test."
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/novee2mqtt

jobs:
  app-image:
    name: Application image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The Supervisor installs the add-on at the version written in
      # addon/config.yaml and pulls the image tagged with it. A release whose
      # tag disagrees with that file would publish images nobody can install,
      # so refuse it here rather than find out from a user.
      #
      # A manual run may instead use the configured version plus a suffix,
      # e.g. 0.0.2-test. That exercises the whole workflow and pushes images
      # under a tag the Supervisor never asks for, so no installable image is
      # touched; such a test build also leaves the `latest` tag alone.
      - name: Check the add-on version matches
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          configured=$(sed -nE 's/^version: *"?([^"]*)"?$/\1/p' addon/config.yaml)
          if [ "$configured" = "$VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ] && [ "${VERSION#"$configured"-}" != "$VERSION" ]; then
            echo "::notice::Test build: '$VERSION' is not the configured version '$configured'. Images are pushed under that tag only and 'latest' is left alone."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::addon/config.yaml declares version '$configured' but this release is '$VERSION'. Bump addon/config.yaml before tagging."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ steps.check.outputs.release == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Nothing in Home Assistant reads addon/build.yaml for an add-on that is
  # pulled from a registry, but it remains the one place that declares the
  # base images and labels. This job turns it into inputs for the image builds;
  # it runs on x64 because the ARM runner image does not ship yq.
  addon-config:
    name: Read add-on configuration
    runs-on: ubuntu-latest
    outputs:
      build_from: ${{ steps.read.outputs.build_from }}
      labels: ${{ steps.read.outputs.labels }}
    steps:
      - uses: actions/checkout@v7

      # The legacy builder derived the io.hass.* labels from config.yaml, so
      # they are kept here; build-image adds io.hass.arch and io.hass.version.
      - name: Read build.yaml and config.yaml
        id: read
        run: |
          {
            echo "build_from=$(yq -o=json -I=0 '.build_from' addon/build.yaml)"
            echo "labels<<EOF"
            echo "io.hass.type=addon"
            echo "io.hass.name=$(yq '.name' addon/config.yaml)"
            echo "io.hass.description=$(yq '.description' addon/config.yaml)"
            echo "io.hass.url=$(yq '.url' addon/config.yaml)"
            yq '.labels | to_entries[] | .key + "=" + .value' addon/build.yaml
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"

  addon-image:
    name: Add-on image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [app-image, addon-config]
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant builds add-ons for amd64 and aarch64 only, each on a
        # native runner, which is exactly what its prepare-multi-arch-matrix
        # action would produce. That action, however, names images
        # "{arch}-novee2mqtt", whereas this add-on was published as
        # "novee2mqtt-{arch}" (see addon/config.yaml), so the matrix is spelled
        # out here. The standalone image above still ships linux/arm/v7.
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The add-on image wraps the application image, which is why this job
      # runs only after app-image has pushed. build-image is the replacement
      # Home Assistant recommends for the deprecated home-assistant/builder
      # action: it supplies BUILD_ARCH and BUILD_VERSION itself, adds the
      # io.hass.arch/version and OCI created/source/version labels the legacy
      # builder used to add, and verifies the base image's cosign signature
      # before building. The add-on images themselves were never signed, and
      # the Supervisor does not check third-party add-ons, so cosign stays off.
      - name: Build and push
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: addon
          image: ${{ env.IMAGE }}-${{ matrix.arch }}
          image-tags: ${{ needs.app-image.outputs.version }}
          version: ${{ needs.app-image.outputs.version }}
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=${{ fromJSON(needs.addon-config.outputs.build_from)[matrix.arch] }}
            APP_IMAGE=${{ env.IMAGE }}:${{ needs.app-image.outputs.version }}
          labels: ${{ needs.addon-config.outputs.labels }}
          cosign: "false"
          cosign-base-verify: ${{ fromJSON(needs.addon-config.outputs.build_from)[matrix.arch] }}
          cosign-base-identity: https://github.com/home-assistant/docker-base/.*
          cache-gha-scope: addon
