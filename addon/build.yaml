labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Novee2Mqtt"
  org.opencontainers.image.description: "Bridges Govee devices into Home Assistant via the MQTT integration."
  org.opencontainers.image.source: "https://github.com/borexola/Novee2Mqtt"
  org.opencontainers.image.licenses: "MIT"

# Pinned explicitly rather than relying on :latest: the release workflow
# verifies each base image's cosign signature against home-assistant/docker-base
# before building, which is only meaningful for a tag that does not move.
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base-debian:bookworm"
  amd64: "ghcr.io/home-assistant/amd64-base-debian:bookworm"
