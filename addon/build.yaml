labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Govee to MQTT Bridge (.NET)"
  org.opencontainers.image.description: "Bridges Govee devices into Home Assistant via the MQTT integration."
  org.opencontainers.image.source: "https://github.com/borexola/Novee2Mqtt"
  org.opencontainers.image.licenses: "MIT"

# Pinned explicitly rather than relying on :latest, because the builder's cosign
# chain of trust cannot be verified against a moving tag.
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base-debian:bookworm"
  armv7: "ghcr.io/home-assistant/armv7-base-debian:bookworm"
  amd64: "ghcr.io/home-assistant/amd64-base-debian:bookworm"
