name: Novee2Mqtt
version: "0.0.5"
slug: novee2mqtt
description: Control Govee devices from Home Assistant over MQTT
url: https://github.com/borexola/novee2mqtt
image: ghcr.io/borexola/novee2mqtt-{arch}

arch:
  - amd64
  - aarch64

init: false
startup: services

# The add-on is useless without a broker, so let the supervisor guarantee one.
services:
  - mqtt:need

# Bluetooth goes through the host's BlueZ daemon over D-Bus, which the default
# AppArmor profile refuses. apparmor.txt is that profile's rules plus BlueZ.
apparmor: true

webui: http://[HOST]:[PORT:8056]/

# The control panel in the Home Assistant sidebar. Ingress proxies the panel
# through Home Assistant, so it works remotely and needs no extra login. With
# host networking the port has to be stated, and it must match http_port.
ingress: true
ingress_port: 8056
panel_icon: mdi:lightbulb-group
panel_title: Novee2Mqtt

# The Govee LAN protocol needs to receive replies on UDP 4002 and to send
# multicast and broadcast discovery packets, neither of which works from inside
# the add-on's own network namespace.
host_network: true

# Bluetooth control goes through the host's BlueZ daemon over D-Bus. Devices
# that cannot use the LAN API and have no route to Govee's cloud are driven
# this way, from the Bluetooth adapter on the Home Assistant host.
host_dbus: true

options:
  temperature_scale: "C"

schema:
  temperature_scale: "str?"
  govee_email: "str?"
  govee_password: "password?"
  govee_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  debug_level: "list(trace|debug|info|warn|error)?"
  no_multicast: "bool?"
  broadcast_all: "bool?"
  global_broadcast: "bool?"
  scan: "str?"
  bluetooth: "bool?"
  bluetooth_adapter: "str?"
  bluetooth_prefer: "bool?"
  bluetooth_addresses: "str?"
  bluetooth_profile: "str?"
  bluetooth_idle_seconds: "int?"
  http_port: "int?"
